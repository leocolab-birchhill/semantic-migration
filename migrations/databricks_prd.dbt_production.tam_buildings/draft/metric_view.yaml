version: "1.1"
source: databricks_prd.semantic_migration_dev.tam_buildings_staging
parameters:
  - name: square_footage_threshold
    data_type: LONG
    default: 100000
  - name: currency
    data_type: STRING
    default: "'cad'"
dimensions:
  - name: consolidated_sector_2
    expr: NULLIF(TRIM(consolidated_sector_2), '')
    display_name: Fct Tam Buildings Consolidated Facility Type
    comment: Top-level facility segmentation used for market sizing.
    synonyms:
      - Consolidated Sector 2
  - name: consolidated_sector_2_sort
    expr: |-
      CASE
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Office' THEN 1
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Industrial' THEN 2
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Warehouse/Distribution' THEN 3
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Manufacturing' THEN 4
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Retail' THEN 5
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Specialty' THEN 6
        WHEN NULLIF(TRIM((NULLIF(TRIM((NULLIF(TRIM(consolidated_sector_2), ''))), ''))), '') = 'Healthcare' THEN 7
        ELSE 999
      END
    display_name: Fct Tam Buildings Consolidated Sector 2 Sort
    comment: Numeric display order for consolidated facility type.
    format:
      type: number
    synonyms:
      - Consolidated Sector 2 Sort
  - name: customer_bridge_bucket
    expr: |-
      CASE
        WHEN customer_match_status = 'Not a Customer' THEN NULL
        WHEN customer_match_status = 'Matched: In TAM' THEN
          CASE WHEN coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold
               THEN '1 In TAM' ELSE '4 Excluded < Threshold (Size)' END
        WHEN customer_match_status = 'Matched: Excluded < 100k Sq Ft' THEN '4 Excluded < Threshold (Size)'
        WHEN customer_match_status = 'No Market ID' THEN
          CASE WHEN coalesce(parent_cust_sf_estimate, 0) >= square_footage_threshold
               THEN '2 In TAM (No Market ID)' ELSE '8 No Market ID - Excluded' END
        WHEN customer_match_status = 'Outside Geographic TAM' THEN '3 Outside Geographic TAM'
        WHEN customer_match_status = 'Matched: Excluded < 20k Sq Ft' THEN '5 Excluded < 20k'
        WHEN customer_match_status = 'Matched: Excluded by Property Type' THEN '6 Residential'
        WHEN customer_match_status = 'Matched: Excluded by Building Not Built' THEN '7 Excluded - Building Not Built'
        ELSE '9 Market Data Not Pulled'
      END
    display_name: Fct Tam Buildings Customer Bridge Bucket
    comment: MECE reconciliation bucket for active customers at the selected minimum account square footage.
    synonyms:
      - Customer Bridge Bucket
  - name: geo_label_for_map
    expr: territory
    display_name: Fct Tam Buildings Geo Label for Map
    comment: Map-ready geography label based on territory.
    synonyms:
      - map geography
      - territory label
      - Geo Label For Map
  - name: in_extended_tam_scope_flag
    expr: |-
      CASE
        WHEN customer_match_status = 'No Market ID'
          THEN coalesce(parent_cust_sf_estimate, 0) >= square_footage_threshold
        WHEN customer_match_status IN ('Matched: In TAM', 'Not a Customer')
          THEN coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold
        ELSE false
      END
    display_name: Fct Tam Buildings In Extended Tam Scope Flag (Yes / No)
    comment: Indicates eligibility for the extended TAM at the selected account square-footage threshold.
    synonyms:
      - In Extended Tam Scope Flag
  - name: market_passes_sf_threshold
    expr: |-
      coalesce(building_rba, 0) >= 20000
      AND _mv_sf_threshold_basis >= square_footage_threshold
    display_name: Fct Tam Buildings Market Passes Sf Threshold (Yes / No)
    comment: Indicates whether a market building passes the building and account-scale thresholds.
    synonyms:
      - Market Passes Sf Threshold
  - name: naics_code
    expr: RIGHT(naics, 6)
    display_name: Fct Tam Buildings Naics Code
    comment: Six-character NAICS code suffix.
    synonyms:
      - Naics Code
  - name: revenue_estimate_selected
    expr: |-
      CASE WHEN lower(currency) = 'usd'
           THEN _mv_revenue_estimate_usd
           ELSE _mv_revenue_estimate_cad
      END
    display_name: Fct Tam Buildings Revenue Estimate Selected
    comment: Per-row revenue estimate in the selected currency; CAD is the default.
    format:
      type: currency
      currency_code: CAD
    synonyms:
      - Revenue Estimate Selected
  - name: sector_sort
    expr: |-
      CASE
        WHEN sector = 'Office - Multi-Tenant' THEN 1
        WHEN sector = 'Office - Single-Tenant' THEN 2
        WHEN sector = 'Flex' THEN 3
        WHEN sector = 'Hospitals' THEN 4
        WHEN sector = 'Long Term Care' THEN 5
        WHEN sector = 'Healthcare - General' THEN 6
        WHEN sector = 'Manufacturing' THEN 7
        WHEN sector = 'Warehouse/Distribution' THEN 8
        WHEN sector = 'Food Processing' THEN 9
        WHEN sector = 'Data Centers' THEN 10
        WHEN sector = 'Industrial - General' THEN 11
        WHEN sector = 'Retail - General' THEN 12
        WHEN sector = 'Freestanding and Department Stores' THEN 13
        WHEN sector = 'Shopping Malls' THEN 14
        WHEN sector = 'Airports' THEN 15
        WHEN sector = 'Airplane Hangars' THEN 16
        WHEN sector = 'Schools' THEN 17
        WHEN sector = 'Sports & Entertainment' THEN 18
        WHEN sector = 'Hotels & Hospitality' THEN 19
        WHEN sector = 'Other' THEN 20
        ELSE 999
      END
    display_name: Fct Tam Buildings Sector Sort
    comment: Numeric display order for detailed facility type.
    format:
      type: number
    synonyms:
      - Sector Sort
  - name: territory
    expr: territory
    display_name: Fct Tam Buildings Territory
    comment: Primary sales territory used for TAM planning and performance management.
  - name: account
    expr: account
    display_name: Fct Tam Buildings Account
    comment: Selected decision-maker stakeholder for the building (for example tenant, owner, or property manager) used for account-level TAM analysis.
  - name: account_number_buildings_total
    expr: account_number_buildings_total
    display_name: "Fct Tam Buildings Account # Buildings"
    format:
      type: number
    synonyms:
      - Account Number Buildings Total
      - Account Number Buildings
  - name: account_sf_total
    expr: account_sf_total
    display_name: Fct Tam Buildings Account Sf Total
    format:
      type: number
    synonyms:
      - Account Sf Total
      - Account Sf
  - name: address
    expr: address
    display_name: Fct Tam Buildings Address
  - name: branch
    expr: branch
    display_name: Fct Tam Buildings Branch
    comment: Operational branch location used for local service delivery (part of Region -> Territory -> Branch hierarchy).
  - name: building_name
    expr: building_name
    display_name: Fct Tam Buildings Building Name
    synonyms:
      - Building Name
  - name: building_rba
    expr: building_rba
    display_name: Fct Tam Buildings Building Square Footage
    comment: Rentable Building Area (RBA) in square feet. Primary size field used in TAM qualification and revenue potential calculations.
    format:
      type: number
    synonyms:
      - Building Rba
  - name: building_status
    expr: building_status
    display_name: Fct Tam Buildings Building Status
    comment: Lifecycle status of the building (for example Existing, Under Construction, Demolished). Existing buildings are typically the TAM-eligible population.
    synonyms:
      - Building Status
  - name: city
    expr: city
    display_name: Fct Tam Buildings City
    comment: City where the building is located.
  - name: country
    expr: country
    display_name: Fct Tam Buildings Country
    comment: Country for the building location (United States or Canada).
  - name: cust_original_building_id
    expr: cust_original_building_id
    display_name: Fct Tam Buildings Cust Original Building ID
    synonyms:
      - Cust Original Building Id
  - name: cust_unified_building_id
    expr: cust_unified_building_id
    display_name: Fct Tam Buildings Customer ID
    comment: Unified customer-system building identifier used for customer-level distinct counts and customer match metrics.
    synonyms:
      - Cust Unified Building Id
  - name: customer_match_status
    expr: customer_match_status
    display_name: Fct Tam Buildings Customer Match Status
    comment: "TAM qualification category for each building (for example Matched: In TAM, No Market ID, Excluded categories, Outside Geographic TAM). Use for customer bridge analysis; do not use this as the only filter for total TAM market sizing."
    synonyms:
      - Customer Match Status
  - name: customer_sf_estimate
    expr: customer_sf_estimate
    display_name: Fct Tam Buildings Customer SF Estimate (with No Market Data)
    comment: Estimated customer square footage used when market data is missing (No Market ID) so customer-adjusted TAM measures remain inclusive.
    format:
      type: number
    synonyms:
      - Customer Sf Estimate
  - name: secondary_type
    expr: secondary_type
    display_name: Fct Tam Buildings Facility Subtype
    synonyms:
      - Secondary Type
  - name: sector
    expr: sector
    display_name: Fct Tam Buildings Facility Type
    comment: Detailed facility type used for granular TAM segmentation within the consolidated facility groups.
  - name: is_current_customer
    expr: is_current_customer
    display_name: Fct Tam Buildings Is Current Customer (Yes / No)
    comment: Yes if the building is currently serviced by GDI; No for prospects/non-customers.
    synonyms:
      - Is Current Customer
  - name: include_in_tam_owner
    expr: |-
      CASE
        WHEN include_in_tam_owner IS TRUE THEN 'Yes'
        WHEN include_in_tam_owner IS FALSE THEN 'No'
        ELSE NULL
      END
    display_name: Fct Tam Buildings Include In Tam Owner (Yes / No)
    comment: Looker yesno filter for owner-in-TAM stakeholder tiles.
    synonyms:
      - Include In Tam Owner
  - name: include_in_tam_property_manager
    expr: |-
      CASE
        WHEN include_in_tam_property_manager IS TRUE THEN 'Yes'
        WHEN include_in_tam_property_manager IS FALSE THEN 'No'
        ELSE NULL
      END
    display_name: Fct Tam Buildings Include In Tam Property Manager (Yes / No)
    comment: Looker yesno filter for property-manager stakeholder tiles.
    synonyms:
      - Include In Tam Property Manager
  - name: include_in_tam_key_tenant
    expr: |-
      CASE
        WHEN include_in_tam_key_tenant IS TRUE THEN 'Yes'
        WHEN include_in_tam_key_tenant IS FALSE THEN 'No'
        ELSE NULL
      END
    display_name: Fct Tam Buildings Include In Tam Key Tenant (Yes / No)
    comment: Looker yesno filter for key-tenant stakeholder tiles.
    synonyms:
      - Include In Tam Key Tenant
  - name: key_tenant_name
    expr: key_tenant_name
    display_name: Fct Tam Buildings Key Tenant Name
    comment: Key tenant associated with the building, used in stakeholder-level market and account analysis.
    synonyms:
      - Key Tenant Name
  - name: key_tenant_sf_total
    expr: key_tenant_sf_total
    display_name: Fct Tam Buildings Key Tenant Sf Total
    format:
      type: number
    synonyms:
      - Key Tenant Sf Total
      - Key Tenant Sf
  - name: largest_tenant_name
    expr: largest_tenant_name
    display_name: Fct Tam Buildings Largest Tenant Name
    comment: Largest tenant identified for the building.
    synonyms:
      - Largest Tenant Name
  - name: latitude
    expr: latitude
    display_name: Fct Tam Buildings Latitude
    comment: Latitude coordinate for mapping.
    format:
      type: number
  - name: longitude
    expr: longitude
    display_name: Fct Tam Buildings Longitude
    comment: Longitude coordinate for mapping.
    format:
      type: number
  - name: naics
    expr: naics
    display_name: Fct Tam Buildings Naics
  - name: national_or_regional_account_flag
    expr: national_or_regional_account_flag
    display_name: Fct Tam Buildings National or Regional
    synonyms:
      - National Or Regional Account Flag
  - name: owner_name
    expr: owner_name
    display_name: Fct Tam Buildings Owner Name
    comment: Building owner organization.
    synonyms:
      - Owner Name
  - name: owner_sf_total
    expr: owner_sf_total
    display_name: Fct Tam Buildings Owner Sf Total
    format:
      type: number
    synonyms:
      - Owner Sf Total
      - Owner Sf
  - name: cust_parent_customer
    expr: cust_parent_customer
    display_name: Fct Tam Buildings Parent Customer
    comment: Parent company rollup used for account-family analysis across multiple buildings and geographies.
    synonyms:
      - Cust Parent Customer
  - name: parent_cust_sf_estimate
    expr: parent_cust_sf_estimate
    display_name: Fct Tam Buildings Parent Customer SF Estimate (with No Market Data)
    format:
      type: number
    synonyms:
      - Parent Cust Sf Estimate
  - name: property_id
    expr: property_id
    display_name: Fct Tam Buildings Property ID
    comment: Primary key for TAM buildings; unique building identifier and the recommended join key for building-grain analysis.
    synonyms:
      - Property Id
  - name: property_manager_name
    expr: property_manager_name
    display_name: Fct Tam Buildings Property Manager Name
    comment: Property manager organization for the building.
    synonyms:
      - Property Manager Name
  - name: property_manager_sf_total
    expr: property_manager_sf_total
    display_name: Fct Tam Buildings Property Manager Sf Total
    format:
      type: number
    synonyms:
      - Property Manager Sf Total
      - Property Manager Sf
  - name: region
    expr: region
    display_name: Fct Tam Buildings Region
    comment: Top-level sales geography used for leadership reporting and security filtering.
  - name: bdm_sales_name
    expr: bdm_sales_name
    display_name: Fct Tam Buildings Sales BDM Name
    synonyms:
      - Bdm Sales Name
  - name: vp_sales_name
    expr: vp_sales_name
    display_name: Fct Tam Buildings Sales VP Name
    synonyms:
      - Vp Sales Name
  - name: state
    expr: state
    display_name: Fct Tam Buildings State
    comment: State or province where the building is located.
  - name: industry
    expr: industry
    display_name: Fct Tam Buildings Tenant Industry
  - name: outside_geographic_tam
    expr: outside_geographic_tam
    display_name: Fct Tam Buildings View Customers Outside of Geographic TAM?
    comment: Flag used to identify customer records outside the formal geographic TAM definition.
    synonyms:
      - Outside Geographic Tam
  - name: zip
    expr: zip
    display_name: Fct Tam Buildings Zip
measures:
  - name: acv_match_out_of_tam_building_size
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded < 100k Sq Ft'), 0)"
    display_name: Fct Tam Buildings ACV Matched Excluded Less Than 100k Sq Ft
    comment: CAD annual contract value in millions for the fixed legacy building-size exclusion status.
    synonyms:
      - excluded size ACV
      - out of TAM building size ACV
      - "Fct Tam Buildings ACV Matched: Excluded < 100k Sq Ft"
      - Acv Match Out Of Tam Building Size
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_out_of_tam_less_than_20k
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded < 20k Sq Ft'), 0)"
    display_name: Fct Tam Buildings ACV Matched Excluded Less Than 20k Sq Ft
    comment: CAD annual contract value in millions for customers excluded below 20k square feet.
    synonyms:
      - excluded under 20k ACV
      - "Fct Tam Buildings ACV Matched: Excluded < 20k Sq Ft"
      - Acv Match Out Of Tam Less Than 20k
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_out_of_tam_not_built
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded by Building Not Built'), 0)"
    display_name: Fct Tam Buildings ACV Matched Excluded by Building Not Built
    comment: CAD annual contract value in millions excluded because buildings are not built.
    synonyms:
      - not built ACV
      - "Fct Tam Buildings ACV Matched: Excluded by Building Not Built"
      - Acv Match Out Of Tam Not Built
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_out_of_tam_property_type
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded by Property Type'), 0)"
    display_name: Fct Tam Buildings ACV Matched Excluded by Property Type
    comment: CAD annual contract value in millions excluded by property type.
    synonyms:
      - residential exclusion ACV
      - "Fct Tam Buildings ACV Matched: Excluded by Property Type"
      - Acv Match Out Of Tam Property Type
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_out_of_tam
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status IN ('Matched: Excluded by Building Not Built', 'Matched: Excluded < 20k Sq Ft', 'Matched: Excluded by Property Type', 'Matched: Excluded < 100k Sq Ft')), 0)"
    display_name: Fct Tam Buildings ACV Matched Excluded from TAM
    comment: Total CAD annual contract value in millions for matched customers excluded from TAM.
    synonyms:
      - excluded from TAM ACV
      - out of TAM ACV
      - "Fct Tam Buildings ACV Matched: Excluded from TAM"
      - Acv Match Out Of Tam
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_in_tam
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: In TAM'), 0)"
    display_name: Fct Tam Buildings ACV Matched In TAM
    comment: CAD annual contract value in millions for customers matched in TAM.
    synonyms:
      - in TAM ACV
      - "Fct Tam Buildings ACV Matched: In TAM"
      - Acv Match In Tam
    format:
      type: currency
      currency_code: CAD
  - name: acv_match_in_tam_plus_no_data
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE (customer_match_status <> 'Not a Customer' OR customer_match_status IS NULL) AND ((customer_match_status = 'No Market ID' AND coalesce(parent_cust_sf_estimate, 0) >= square_footage_threshold) OR (customer_match_status IN ('Matched: In TAM', 'Not a Customer') AND coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold))), 0)"
    display_name: Fct Tam Buildings ACV Matched In TAM Plus Customers Included
    comment: CAD ACV in millions for customer sites included in extended TAM.
    synonyms:
      - extended TAM ACV
      - "Fct Tam Buildings ACV Matched: In TAM Plus Customers Included"
      - Acv Match In Tam Plus No Data
    format:
      type: currency
      currency_code: CAD
  - name: acv_no_market_data
    expr: COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'No Market ID'), 0)
    display_name: Fct Tam Buildings ACV No Market ID
    comment: CAD ACV in millions for customers without a market identifier.
    synonyms:
      - no market ID ACV
      - Acv No Market Data
    format:
      type: currency
      currency_code: CAD
  - name: acv_no_market_data_excluded
    expr: COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'No Market ID' AND lower(include_in_tam_customer_estimate) = 'no'), 0)
    display_name: Fct Tam Buildings ACV No Market ID Customers Excluded
    comment: CAD ACV in millions for excluded customers without a market identifier.
    synonyms:
      - excluded no market ID ACV
      - Acv No Market Data Excluded
    format:
      type: currency
      currency_code: CAD
  - name: acv_no_match_has_market_data
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Not Matched: Market Data Not Pulled (Yet)'), 0)"
    display_name: Fct Tam Buildings ACV Not Matched Market Data Not Pulled Yet
    comment: CAD ACV in millions for customer sites awaiting market-data retrieval.
    synonyms:
      - market data not pulled ACV
      - "Fct Tam Buildings ACV Not Matched: Market Data Not Pulled (Yet)"
      - Acv No Match Has Market Data
    format:
      type: currency
      currency_code: CAD
  - name: customer_acv_outside_geographic_tam
    expr: COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status = 'Outside Geographic TAM'), 0)
    display_name: Fct Tam Buildings ACV Outside Geographic TAM
    comment: CAD ACV in millions outside the geographic TAM.
    synonyms:
      - outside geography ACV
      - Customer Acv Outside Geographic Tam
    format:
      type: currency
      currency_code: CAD
  - name: acv_market_data_subtotal
    expr: "COALESCE(SUM(_mv_customer_acv_year_cad / 1000000.0) FILTER (WHERE customer_match_status IN ('Matched: In TAM', 'Matched: Excluded by Property Type', 'Matched: Excluded by Building Not Built', 'Matched: Excluded < 100k Sq Ft', 'Outside Geographic TAM', 'Matched: Excluded < 20k Sq Ft')), 0)"
    display_name: Fct Tam Buildings ACV Total Customers with Market Data
    comment: CAD ACV in millions for customers whose market data has been classified.
    synonyms:
      - market data ACV subtotal
      - Acv Market Data Subtotal
    format:
      type: currency
      currency_code: CAD
  - name: accounts_count
    expr: COALESCE(COUNT(DISTINCT account), 0)
    display_name: Fct Tam Buildings Account Count
    comment: Distinct count of account decision-makers in the result set.
    synonyms:
      - distinct accounts
      - account decision makers
      - Accounts Count
      - Accounts
    format:
      type: number
  - name: avg_acct_sf_per_building_customer_adjusted
    expr: |-
      COALESCE(SUM(COALESCE(building_sf_occupied_by_account, customer_sf_estimate)) FILTER (WHERE (customer_match_status = 'No Market ID' AND coalesce(parent_cust_sf_estimate, 0) >= square_footage_threshold) OR (customer_match_status IN ('Matched: In TAM', 'Not a Customer') AND coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold)), 0)
      / NULLIF(COUNT(DISTINCT property_id) FILTER (WHERE (customer_match_status = 'No Market ID' AND coalesce(parent_cust_sf_estimate, 0) >= square_footage_threshold) OR (customer_match_status IN ('Matched: In TAM', 'Not a Customer') AND coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold)), 0)
    display_name: Fct Tam Buildings Average Building Size (Sq Ft)
    comment: Average eligible TAM building size using occupied SF with customer estimate fallback.
    synonyms:
      - average TAM building size
      - average building SF
      - Avg Acct Sf Per Building Customer Adjusted
      - Acct Sf Per Building Customer Adjusted
    format:
      type: number
  - name: bridge_acv_crit_account_scale
    expr: "COALESCE(SUM(CASE WHEN lower(currency) = 'usd' THEN _mv_customer_acv_year_usd ELSE _mv_customer_acv_year_cad END / 1000000.0) FILTER (WHERE (customer_match_status = 'Matched: In TAM' AND NOT (coalesce(building_rba, 0) >= 20000 AND _mv_sf_threshold_basis >= square_footage_threshold)) OR customer_match_status = 'Matched: Excluded < 100k Sq Ft' OR (customer_match_status = 'No Market ID' AND coalesce(parent_cust_sf_estimate, 0) < square_footage_threshold) OR customer_match_status NOT IN ('Not a Customer', 'Matched: In TAM', 'Matched: Excluded < 100k Sq Ft', 'No Market ID', 'Outside Geographic TAM', 'Matched: Excluded < 20k Sq Ft', 'Matched: Excluded by Property Type', 'Matched: Excluded by Building Not Built')), 0)"
    display_name: Fct Tam Buildings Bridge ACV Account Scale ($MM)
    comment: Selected-currency ACV in millions for account-scale-related bridge exclusions.
    synonyms:
      - account scale bridge ACV
      - "Fct Tam Buildings Bridge ACV: + Account Scale ($MM)"
      - Bridge Acv Crit Account Scale
    format:
      type: number
  - name: bridge_acv_excl_not_built
    expr: "COALESCE(SUM(CASE WHEN lower(currency) = 'usd' THEN _mv_customer_acv_year_usd ELSE _mv_customer_acv_year_cad END / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded by Building Not Built'), 0)"
    display_name: Fct Tam Buildings Bridge ACV Excluded Building Not Built ($MM)
    comment: Selected-currency bridge ACV in millions excluded because buildings are not built.
    synonyms:
      - not built bridge ACV
      - "Fct Tam Buildings Bridge ACV: + Excluded - Building Not Built ($MM)"
      - Bridge Acv Excl Not Built
    format:
      type: number
  - name: bridge_acv_excl_20k
    expr: "COALESCE(SUM(CASE WHEN lower(currency) = 'usd' THEN _mv_customer_acv_year_usd ELSE _mv_customer_acv_year_cad END / 1000000.0) FILTER (WHERE customer_match_status = 'Matched: Excluded < 20k Sq Ft'), 0)"
    display_name: Fct Tam Buildings Bridge ACV Excluded Less Than 20k ($MM)
    comment: Selected-currency bridge ACV in millions excluded below 20k square feet.
    synonyms:
